name: CI

# Roda a cada envio para a main e em todo Pull Request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (testes unitários e de integração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "true"
      JWT_SECRET: chave-usada-somente-no-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes unitários
        run: python -m pytest tests/unit -v --cov

      - name: Testes de integração e cobertura (mínimo 85%)
        run: python -m pytest tests/integracao -v --cov --cov-append --cov-report=term --cov-fail-under=85

      - name: Migrações aplicam do zero
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head

      - name: Dependências sem vulnerabilidades conhecidas
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Dependências sem vulnerabilidades altas
        run: npm audit --audit-level=high
